<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grupo Asalto - Booking & Contact</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #0d0d0d;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #171717;
      border: 1px solid #332d18;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      text-align: center;
    }
    .header-banner {
      background: linear-gradient(180deg, #2a2012 0%, #171717 100%);
      padding: 28px 16px 16px;
      border-bottom: 1px solid #2e2613;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #d4af37;
      border: 1px solid #d4af37;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-transform: uppercase;
    }
    h2 {
      font-size: 16px;
      color: #d4af37;
      margin-top: 6px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .content {
      padding: 20px;
    }
    .contact-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 14px;
      color: #cccccc;
      margin-bottom: 16px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #d4af37;
      color: #121212;
    }
    .btn-secondary {
      background: #242424;
      color: #ffffff;
      border: 1px solid #333333;
    }
    .social-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #242424;
    }
    .social-row a {
      color: #d4af37;
      font-size: 24px;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-banner">
      <div class="badge">Regio Mex Music Group</div>
      <h1>Grupo Asalto</h1>
      <h2>Fernando Sánchez Flores</h2>
      <p style="font-size: 12px; color: #888888; margin-top: 4px;">Booking & Representación</p>
    </div>

    <div class="content">
      <div class="contact-item">
        <i class="fa-solid fa-location-dot" style="color: #d4af37;"></i>
        <span>3106 West Ave, San Antonio, TX 78213</span>
      </div>

      <a href="tel:2103850515" class="btn btn-primary">
        <i class="fa-solid fa-phone"></i> Llamar (210) 385-0515
      </a>

      <a href="https://wa.me/12103850515?text=Hola,%20me%20gustar%C3%ADa%20informaci%C3%B3n%20para%20contrataciones%20de%20Grupo%20Asalto" class="btn btn-secondary">
        <i class="fa-brands fa-whatsapp" style="color: #25D366;"></i> Enviar WhatsApp
      </a>

      <a href="mailto:fersan17@gmail.com?subject=Contrataciones%20Grupo%20Asalto" class="btn btn-secondary">
        <i class="fa-solid fa-envelope"></i> Enviar Correo
      </a>

      <div class="social-row">
        <a href="https://instagram.com/grupo_asalto_oficial" target="_blank" aria-label="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://facebook.com/grupoasalto" target="_blank" aria-label="Facebook">
          <i class="fa-brands fa-facebook"></i>
        </a>
        <a href="https://tiktok.com/@grupoasalto" target="_blank" aria-label="TikTok">
          <i class="fa-brands fa-tiktok"></i>
        </a>
      </div>
    </div>
  </div>

</body>
</html>
